name: Auto-assign Issue author

on:
  issues:
    types:
      - opened
      - reopened

permissions:
  issues: write

jobs:
  assign-author:
    name: Assign Issue author
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Assign Issue author
        uses: actions/github-script@v7
        with:
          script: |
            const assignee = context.payload.issue.user.login;

            try {
              await github.request(
                "GET /repos/{owner}/{repo}/issues/{issue_number}/assignees/{assignee}",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  assignee,
                },
              );

              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                assignees: [assignee],
              });

              core.info(`${assignee} 사용자를 assignee로 등록했습니다.`);
            } catch (error) {
              if (error.status === 404) {
                core.info(
                  `${assignee} 사용자는 이 Issue에 할당할 수 없어 건너뜁니다.`,
                );
                return;
              }

              throw error;
            }
