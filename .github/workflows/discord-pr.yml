name: Discord PR notification

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - closed

permissions: {}

jobs:
  notify:
    name: Notify Discord
    if: github.event.action == 'opened' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send PR notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          EVENT_ACTION: ${{ github.event.action }}

          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}

          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}

        run: |
          case "${PR_AUTHOR,,}" in
            clacki)
              AUTHOR_NAME="김광욱"
              TARGET_DISCORD_ID="789496933554323497"
              ;;
            alstmd9902)
              AUTHOR_NAME="오승연"
              TARGET_DISCORD_ID="768360541995008010"
              ;;
            *)
              echo "No Discord mapping for this PR author; notification skipped."
              exit 0
              ;;
          esac

          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL secret is not configured."
            exit 1
          fi

          if [[ "$EVENT_ACTION" == "opened" ]]; then
            MESSAGE="<@$TARGET_DISCORD_ID> **${AUTHOR_NAME}님이 PR을 올렸습니다. 리뷰를 확인해주세요.**"
            EMBED_TITLE="🔀 PR #${PR_NUMBER} · ${PR_TITLE}"
            STATUS="리뷰 요청"
            COLOR=5793266
          elif [[ "$EVENT_ACTION" == "closed" && "$PR_MERGED" == "true" ]]; then
            MESSAGE="<@$TARGET_DISCORD_ID> **${AUTHOR_NAME}님의 PR이 병합되었습니다.**"
            EMBED_TITLE="✅ PR #${PR_NUMBER} · ${PR_TITLE}"
            STATUS="병합 완료"
            COLOR=5763719
          else
            echo "This pull request event does not require a notification."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg content "$MESSAGE" \
            --arg target_id "$TARGET_DISCORD_ID" \
            --arg title "$EMBED_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$AUTHOR_NAME" \
            --arg github_author "$PR_AUTHOR" \
            --arg head "$HEAD_BRANCH" \
            --arg base "$BASE_BRANCH" \
            --arg status "$STATUS" \
            --argjson color "$COLOR" \
            '{
              content: $content,
              allowed_mentions: {
                parse: [],
                users: [$target_id]
              },
              embeds: [
                {
                  title: $title,
                  url: $url,
                  color: $color,
                  fields: [
                    {
                      name: "브랜치",
                      value: ("`" + $head + "` → `" + $base + "`"),
                      inline: false
                    },
                    {
                      name: "작성자",
                      value: ($author + " (`" + $github_author + "`)"),
                      inline: true
                    },
                    {
                      name: "상태",
                      value: $status,
                      inline: true
                    }
                  ],
                  footer: {
                    text: "PlanB GitHub"
                  }
                }
              ]
            }')

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
