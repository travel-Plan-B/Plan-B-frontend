# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"

reviews:
  profile: quiet
  collapse_walkthrough: false

  # 한국어 요약만 최대한 깔끔하게 유지
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    모든 내용을 한국어로 작성하세요.

    다음 형식으로만 간결하게 작성하세요.

    ## 변경 요약

    PR의 핵심 변경 내용을 2~4개의 bullet로 요약하세요.

    ## 주요 확인 사항

    리뷰어가 확인할 필요가 있는 중요한 내용이 있을 때만 작성하세요.
    특별한 사항이 없다면 이 섹션은 생략하세요.

    기술 용어, 코드 식별자, 파일명, 라이브러리명 등
    번역이 부자연스러운 항목만 원문을 유지하세요.
    설명 문장은 영어로 작성하지 마세요.

  # 기본 Walkthrough 부가 섹션 제거
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  review_status: false
  enable_prompt_for_ai_agents: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "dev"

  # CodeRabbit 자체 PR 메타 검사 제거
  pre_merge_checks:
    title:
      mode: off
    description:
      mode: off
    issue_assessment:
      mode: off
    docstrings:
      mode: off

  # 사용하지 않는 후처리 기능 제거
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        모든 리뷰 코멘트와 설명은 한국어로 작성하세요.

        이 프로젝트는 소규모 2인 Next.js MVP 및 포트폴리오 프로젝트입니다.
        과도한 추상화보다 실제 동작의 정확성과 유지보수성을 우선하세요.

        다음 문제를 우선적으로 리뷰하세요.

        1. 실제 버그와 잘못된 동작
        2. TypeScript 타입 안정성과 데이터 흐름 문제
        3. React, Next.js App Router, TanStack Query의 명확한 잘못된 사용
        4. `app / features / shared` 구조의 명확한 경계 위반
        5. 사용자에게 실제 영향을 주는 UX, 접근성, 성능, 보안 문제

        다음 항목은 특별한 문제가 없다면 리뷰하지 마세요.

        - 네이밍이나 코드 스타일 취향
        - ESLint 또는 Prettier가 처리할 문제
        - 단순히 다른 구현 방식이 더 낫다는 이유의 리팩터링
        - 일회성 코드의 불필요한 공통화
        - 미래 확장성을 위한 과도한 추상화
        - 작은 컴포넌트나 함수의 불필요한 분리
        - 사용자에게 체감되지 않는 미세한 성능 최적화

        Server Component를 기본으로 보되 필요한 `"use client"`는 허용하세요.
        TanStack Query에서는 query key, invalidation, stale cache,
        중복 서버 상태 등 실제 오류 가능성이 있는 부분을 확인하세요.
        `shared` 이동은 실제 재사용되거나 명확히 도메인 독립적인 경우에만 제안하세요.

        많은 사소한 코멘트보다 적은 수의 확실하고 영향도 높은 코멘트를 우선하세요.
        현재 구현이 MVP 범위에서 올바르고 이해하기 쉽다면 선택적인 재작성은 제안하지 마세요.
